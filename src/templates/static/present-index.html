<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Presentations</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/present.css">
  <style>
    .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .who { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text); }
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .hero h1 { font-family: var(--font-display); font-size: clamp(1.3rem, 3vw, 1.9rem); color: var(--text-strong); letter-spacing: 0.06em; }
    .hero p { margin-top: 0.35rem; max-width: 52ch; }
    .new-form { display: flex; gap: 0.6rem; width: min(440px, 100%); }
    .banner { margin-bottom: 1.25rem; }
    section { margin-top: 2.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.1rem; }
    .card { display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .cover { aspect-ratio: 16 / 9; background: #070914 center / cover no-repeat; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
    .cover .ph { font-family: var(--font-display); font-size: 2rem; color: rgba(0,229,255,0.16); }
    .card-body { padding: 0.95rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .card h3 { font-family: var(--font-body); font-weight: 600; font-size: 1.15rem; color: var(--text-strong); line-height: 1.2; overflow-wrap: anywhere; }
    .card .desc { font-size: 0.92rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }
    .actions { display: flex; gap: 0.45rem; margin-top: auto; padding-top: 0.5rem; }
    .actions form { margin-left: auto; }
    .empty { grid-column: 1 / -1; padding: 2.2rem 1.25rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); }
    details.pw { margin-top: 3rem; max-width: 460px; }
    details.pw summary { cursor: pointer; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    details.pw form { display: grid; gap: 0.75rem; padding: 1.1rem; margin-top: 0.8rem; }
  </style>
</head>
<body class="grid-bg">
  <header class="topbar">
    <span class="logo"><span class="br">[ </span>PRESENT<span class="br"> ]</span></span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <a class="btn small ghost" href="{{ base | escape }}/logout">Sign out</a>
  </header>

  <main class="wrap">
    <div id="banners"></div>

    <div class="hero">
      <div>
        <div class="eyebrow">// library</div>
        <h1>Interactive presentations</h1>
        <p>Build branching slide sequences with images, video, audio, buttons and timers. Keep them private or share them with everyone who has an account.</p>
      </div>
      <form class="new-form" method="post" action="{{ base | escape }}/new">
        <input class="input" name="title" placeholder="Title for a new presentation" maxlength="200" aria-label="New presentation title">
        <button class="btn go" type="submit">+ New</button>
      </form>
    </div>

    <section>
      <h2 class="section">Your presentations</h2>
      <div class="grid" id="mine"></div>
    </section>

    <section id="shared-section">
      <h2 class="section">Shared by others</h2>
      <div class="grid" id="shared"></div>
    </section>

    <details class="pw">
      <summary>Change password</summary>
      <form class="panel" method="post" action="{{ base | escape }}/password">
        <div class="field"><label for="cur">Current password</label><input class="input" id="cur" type="password" name="current_password" autocomplete="current-password" required></div>
        <div class="field"><label for="np">New password</label><input class="input" id="np" type="password" name="new_password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="cp">Confirm new password</label><input class="input" id="cp" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn primary" type="submit">Update password</button>
      </form>
    </details>
  </main>

  <script id="data" type="application/json">{{ data_json }}</script>
  <script>
  {% raw %}
  (function () {
    const data = JSON.parse(document.getElementById('data').textContent);
    const base = data.base;

    function el(tag, attrs, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      }
      for (const c of children) if (c) node.append(c);
      return node;
    }

    document.getElementById('who').textContent = data.account.display_name;

    const banners = document.getElementById('banners');
    if (data.notice) banners.append(el('div', { class: 'banner ok', role: 'status', text: data.notice }));
    if (data.error) banners.append(el('div', { class: 'banner err', role: 'alert', text: data.error }));
    if (data.notice || data.error) history.replaceState(null, '', base);

    function card(p, own) {
      const cover = el('div', { class: 'cover' });
      if (p.cover) cover.style.backgroundImage = 'url("' + base + '/media/' + p.cover.split('/').map(encodeURIComponent).join('/') + '")';
      else cover.append(el('span', { class: 'ph', text: '▶' }));

      const meta = el('div', { class: 'meta' },
        el('span', { class: 'chip ' + (p.visibility === 'shared' ? 'green' : 'muted'), text: p.visibility === 'shared' ? 'Shared' : 'Private' }),
        el('span', { text: p.page_count + (p.page_count === 1 ? ' page' : ' pages') }),
        el('span', { text: own ? 'Updated ' + p.updated_at.slice(0, 10) : 'by ' + p.author }),
      );

      const actions = el('div', { class: 'actions' },
        el('a', { class: 'btn small go', href: base + '/play/' + p.id, text: 'Play' }));
      if (own) {
        actions.append(el('a', { class: 'btn small', href: base + '/edit/' + p.id, text: 'Edit' }));
        const del = el('form', { method: 'post', action: base + '/delete/' + p.id },
          el('button', { class: 'btn small danger', type: 'submit', text: 'Delete' }));
        del.addEventListener('submit', (e) => {
          if (!confirm('Delete "' + p.title + '" and all of its media? This cannot be undone.')) e.preventDefault();
        });
        actions.append(del);
      }

      return el('article', { class: 'card panel' }, cover,
        el('div', { class: 'card-body' },
          el('h3', { text: p.title }),
          p.description ? el('p', { class: 'desc', text: p.description }) : null,
          meta, actions));
    }

    const mine = document.getElementById('mine');
    if (data.mine.length) data.mine.forEach((p) => mine.append(card(p, true)));
    else mine.append(el('div', { class: 'empty', text: 'Nothing here yet. Give your first presentation a title above and press + New.' }));

    const shared = document.getElementById('shared');
    if (data.shared.length) data.shared.forEach((p) => shared.append(card(p, false)));
    else shared.append(el('div', { class: 'empty', text: 'When someone shares a presentation it shows up here.' }));
  })();
  {% endraw %}
  </script>
</body>
</html>
